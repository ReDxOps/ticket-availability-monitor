[project]
name = "ticket-availability-monitor"
version = "0.1.0"
description = "Service de surveillance 24h/24 de la billetterie See Tickets Resell pour Dream Nation 2026 avec alertes Telegram"
authors = [{ name = "Dream Nation Monitor Team" }]
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
